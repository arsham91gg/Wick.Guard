<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WICK GUARD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #18251f 0%, #0b100e 45%, #050706 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: rgba(16, 22, 19, 0.95);
      border: 1px solid #26352e;
      border-radius: 22px;
      padding: 35px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(145deg, #1f7a4d, #0c3927);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 0 30px rgba(30, 180, 105, .18);
    }

    h1 {
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8d9b94;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: right;
      color: #cbd4cf;
      font-size: 14px;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #304039;
      outline: none;
      background: #0b110e;
      color: white;
      font-size: 15px;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #28a866;
      box-shadow: 0 0 0 3px rgba(40,168,102,.1);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #28a866, #197044);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .error {
      display: none;
      color: #ff7777;
      font-size: 13px;
      margin-top: 13px;
    }

    .footer {
      margin-top: 25px;
      color: #5e6964;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🛡️</div>

    <h1>WICK GUARD</h1>

    <p class="subtitle">
      مرکز خصوصی مدیریت اعضا
    </p>

    <label for="etName">
      نام شما در ایتا
    </label>

    <input
      id="etName"
      type="text"
      placeholder="مثلاً: AMGAME"
      maxlength="30"
      autocomplete="off"
    >

    <button onclick="login()">
      ورود به WICK GUARD
    </button>

    <div class="error" id="error">
      لطفاً نام ایتا را وارد کنید.
    </div>

    <div class="footer">
      WICK GUARD • Private Community
    </div>

  </div>

  <script>
    function login() {

      const name = document.getElementById("etName").value.trim();
      const error = document.getElementById("error");

      if (name === "") {
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      localStorage.setItem("wickGuardName", name);

      alert("خوش آمدی " + name + " 👋");

      // مرحله بعد داشبورد WICK GUARD را اینجا اضافه می‌کنیم
    }
  </script>

</body>
  </html>
